services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geospatial_mlops_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geospatial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-landcover}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geospatial} -d ${POSTGRES_DB:-landcover}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
