services:
  postgis:
    extends:
      file: docker-compose.yml
      service: postgis

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: geospatial_mlops_backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geospatial}:${POSTGRES_PASSWORD:-change_me_local_password}@postgis:5432/${POSTGRES_DB:-landcover}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
